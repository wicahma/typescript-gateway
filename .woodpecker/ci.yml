clone:
  git:
    image: bash
    settings:
      lfs: false

labels:
  backend: local

steps:
  - name: ci
    image: bash
    commands:
      - export PATH="/home/diama/.nvm/versions/node/v22.23.2/bin:/home/diama/.local/bin:$PATH"
      - node -v && npm -v
      - npm ci || npm install
      - npm run typecheck
      - npm test
      - npm run build

when:
  event: push
  branch: [main, develop]
