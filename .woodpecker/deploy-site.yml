clone:
  git:
    image: bash
    settings:
      lfs: false

labels:
  backend: local

steps:
  - name: build-site
    image: bash
    commands:
      - export PATH="/home/diama/.nvm/versions/node/v22.23.2/bin:/home/diama/.local/bin:$PATH"
      - node -v && npm -v
      - cd site
      - npm ci || npm install
      - npm run build

  - name: deploy-cloudflare
    image: bash
    depends_on:
      - build-site
    environment:
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: cf_account_id
      CLOUDFLARE_API_TOKEN:
        from_secret: cf_api_token
    commands:
      - export PATH="/home/diama/.nvm/versions/node/v22.23.2/bin:/home/diama/.local/bin:$PATH"
      - cd site
      - npx wrangler pages deploy dist --project-name=tsgate --branch=main --commit-dirty=true

when:
  - event: push
    branch: main
  - event: tag
    ref: refs/tags/v*
